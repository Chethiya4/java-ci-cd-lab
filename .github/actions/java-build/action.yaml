name: "Build Status Action"
description: "Returns build result"

outputs:
  result:
    description: "Build result"
    value: ${{ steps.set-status.outputs.result }} 

runs:
  using: "composite"

  steps:
    - name: Set Output
      id: set-status 
      run: echo "result=Build Successful" >> $GITHUB_OUTPUT 
      shell: bash